x-backend-common: &backend-common
  build:
    context: ./backend
    target: production
  env_file: .env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  networks:
    - omnimind-net
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    environment:
      POSTGRES_USER: omnimind
      POSTGRES_PASSWORD: password
      POSTGRES_DB: omnimind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./backend/migrations/v2_enhancements.sql:/docker-entrypoint-initdb.d/02_v2_enhancements.sql
      - ./backend/migrations/seed_cases.sql:/docker-entrypoint-initdb.d/03_seed_cases.sql
      - ./backend/migrations/v3_dynamic_config.sql:/docker-entrypoint-initdb.d/04_v3_dynamic_config.sql
      - ./backend/migrations/v4_role_system.sql:/docker-entrypoint-initdb.d/05_v4_role_system.sql
      - ./backend/migrations/v5_notification_log.sql:/docker-entrypoint-initdb.d/06_v5_notification_log.sql
      - ./backend/migrations/v6_tier_configs_seed.sql:/docker-entrypoint-initdb.d/07_v6_tier_configs_seed.sql
      - ./backend/migrations/v7_accuracy_enhancement.sql:/docker-entrypoint-initdb.d/08_v7_accuracy_enhancement.sql
      - ./backend/migrations/v8_growth_system.sql:/docker-entrypoint-initdb.d/09_v8_growth_system.sql
      - ./backend/migrations/v9_extra_symbols.sql:/docker-entrypoint-initdb.d/10_v9_extra_symbols.sql
      - ./backend/migrations/v9_payment_duration.sql:/docker-entrypoint-initdb.d/11_v9_payment_duration.sql
      - ./backend/migrations/v10_calendar_events.sql:/docker-entrypoint-initdb.d/12_v10_calendar_events.sql
      - ./backend/migrations/v11_agent_configs.sql:/docker-entrypoint-initdb.d/13_v11_agent_configs.sql
      - ./backend/migrations/v_coinglass.sql:/docker-entrypoint-initdb.d/14_v_coinglass.sql
      - ./backend/migrations/v3_leaderboard.sql:/docker-entrypoint-initdb.d/15_v3_leaderboard.sql
      - ./backend/migrations/add_playbook_lifecycle_fields.sql:/docker-entrypoint-initdb.d/16_add_playbook_lifecycle.sql
      - ./backend/migrations/v12_payment_provider_audit.sql:/docker-entrypoint-initdb.d/17_v12_payment_provider_audit.sql
      - ./backend/migrations/v13_i18n_user_preferences.sql:/docker-entrypoint-initdb.d/18_v13_i18n_user_preferences.sql
      - ./backend/migrations/v14_commission_idempotent.sql:/docker-entrypoint-initdb.d/19_v14_commission_idempotent.sql
      - ./backend/migrations/v15_email_normalize.sql:/docker-entrypoint-initdb.d/20_v15_email_normalize.sql
      - ./backend/migrations/v16_resend_config.sql:/docker-entrypoint-initdb.d/21_v16_resend_config.sql
      - ./backend/migrations/v17_email_suppression.sql:/docker-entrypoint-initdb.d/22_v17_email_suppression.sql
      - ./backend/migrations/seed_cases_2025.sql:/docker-entrypoint-initdb.d/99_seed_cases_2025.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnimind"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
    restart: unless-stopped
    networks:
      - omnimind-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy volatile-lru
    # 生产环境不暴露到主机，避免与宝塔 Redis 冲突；容器间用 redis:6379 访问
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
    restart: unless-stopped
    networks:
      - omnimind-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    <<: *backend-common
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=postgres,redis,localhost,127.0.0.1,host.docker.internal
      - DEPLOY_AGENT_URL=${DEPLOY_AGENT_URL:-http://host.docker.internal:9321}
      - DEPLOY_AGENT_TOKEN=${DEPLOY_AGENT_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M

  worker:
    <<: *backend-common
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=postgres,redis,localhost,127.0.0.1
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.celery_app inspect ping --timeout 10 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M

  beat:
    <<: *backend-common
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=postgres,redis,localhost,127.0.0.1
    command: celery -A workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule --pidfile=/tmp/celerybeat.pid
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 64M

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        - API_PROXY_URL=http://backend:8000
    ports:
      - "3000:3000"
    environment:
      - API_PROXY_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:3000/dashboard"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
    restart: unless-stopped
    networks:
      - omnimind-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:

networks:
  omnimind-net:
    driver: bridge
